<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="ALICE — Assisted Local Inference Career Engine">
  <title>ALICE — Assisted Local Inference Career Engine</title>
  <defs>
    <radialGradient id="glowRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0521f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c0521f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowForest" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f5d4a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2f5d4a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="958" height="298" rx="20"/></clipPath>
    <g id="job">
      <rect width="44" height="28" rx="5" fill="#ffffff" stroke="#e6dfd4"/>
      <rect x="6" y="7" width="22" height="3" rx="1.5" fill="#b78a2b"/>
      <rect x="6" y="14" width="30" height="3" rx="1.5" fill="#e6dfd4"/>
      <rect x="6" y="20" width="18" height="3" rx="1.5" fill="#e6dfd4"/>
    </g>
  </defs>
  <style>
    .serif { font-family: Fraunces, 'Iowan Old Style', Georgia, serif; }
    .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .glow { animation: breathe 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .glow.two { animation-delay: -3.5s; }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }

    .k { opacity: 0; animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .a { animation-name: passA; animation-delay: 0s; }
    .b { animation-name: drop;  animation-delay: 1.5s; }
    .c { animation-name: passC; animation-delay: 3s; }
    .d { animation-name: drop;  animation-delay: 4.5s; }
    .e { animation-name: drop;  animation-delay: 6s; }
    .f { animation-name: passF; animation-delay: 7.5s; }
    @keyframes passA { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 40% { transform: translate(140px,0); } 70% { transform: translate(240px,60px); opacity: 1; } 84%,100% { transform: translate(240px,60px); opacity: 0; } }
    @keyframes passC { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 40% { transform: translate(140px,0); } 70% { transform: translate(240px,-20px); opacity: 1; } 84%,100% { transform: translate(240px,-20px); opacity: 0; } }
    @keyframes passF { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 40% { transform: translate(140px,0); } 70% { transform: translate(240px,-40px); opacity: 1; } 84%,100% { transform: translate(240px,-40px); opacity: 0; } }
    @keyframes drop  { 0% { transform: translate(0,0); opacity: 0; } 8% { opacity: 1; } 38% { transform: translate(130px,0); opacity: 1; } 58%,100% { transform: translate(150px,46px); opacity: 0; } }

    .gate { animation: gate 3s ease-in-out infinite; }
    @keyframes gate { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .badge { animation: pop 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0%,62%,100% { transform: scale(1); } 70% { transform: scale(1.08); } 78% { transform: scale(1); } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="958" height="298" rx="20" fill="#f7f4ee" stroke="#e6dfd4"/>
  <g clip-path="url(#cardClip)">
    <circle class="glow" cx="820" cy="70" r="190" fill="url(#glowRust)"/>
    <circle class="glow two" cx="680" cy="270" r="170" fill="url(#glowForest)"/>
  </g>

  <!-- copy -->
  <text x="48" y="62" class="mono" font-size="12" letter-spacing="2.2" fill="#c0521f">LOCAL · $0 INFERENCE · HUMAN IN THE LOOP</text>
  <text x="44" y="140" class="serif" font-size="78" fill="#191614" letter-spacing="-1.5">ALICE<tspan class="caret" fill="#c0521f">.</tspan></text>
  <text x="48" y="172" class="sans" font-size="19" font-weight="600" fill="#3b3530">Assisted Local Inference Career Engine</text>
  <text x="48" y="202" class="sans" font-size="15" fill="#736a60">Local, $0-inference job pipeline.</text>
  <text x="48" y="224" class="serif" font-size="16" font-style="italic" fill="#3b3530">She reads the boards — you keep the click.</text>

  <!-- fact chips -->
  <g class="mono" font-size="12" fill="#3b3530">
    <rect x="48"  y="246" width="134" height="28" rx="14" fill="#fffdf9" stroke="#e6dfd4"/>
    <circle cx="64" cy="260" r="4" fill="#b78a2b"/>
    <text x="74" y="264">8 job sources</text>
    <rect x="192" y="246" width="142" height="28" rx="14" fill="#fffdf9" stroke="#e6dfd4"/>
    <circle cx="208" cy="260" r="4" fill="#2f5d4a"/>
    <text x="218" y="264">2 local models</text>
    <rect x="344" y="246" width="142" height="28" rx="14" fill="#fffdf9" stroke="#e6dfd4"/>
    <circle cx="360" cy="260" r="4" fill="#c0521f"/>
    <text x="370" y="264">15 picks / day</text>
    <rect x="496" y="246" width="126" height="28" rx="14" fill="#fffdf9" stroke="#e6dfd4"/>
    <circle cx="512" cy="260" r="4" fill="#191614"/>
    <text x="522" y="264">0 auto-sends</text>
  </g>

  <!-- animation: listings in, gates, today's stack -->
  <text x="622" y="50" class="mono" font-size="11" letter-spacing="1.6" fill="#a89d90">LISTINGS</text>
  <text x="772" y="50" class="mono" font-size="11" letter-spacing="1.6" fill="#2f5d4a">GATES</text>
  <text x="852" y="50" class="mono" font-size="11" letter-spacing="1.6" fill="#c0521f">TODAY</text>

  <rect class="gate" x="786" y="62" width="8" height="160" rx="4" fill="#eaf1ed" stroke="#2f5d4a"/>
  <text x="808" y="244" class="mono" font-size="11" fill="#a89d90">archived ↓</text>

  <!-- today's stack -->
  <g transform="translate(856,96)">
    <rect x="8" y="16" width="56" height="36" rx="6" fill="#ffffff" stroke="#e6dfd4"/>
    <rect x="4" y="8" width="56" height="36" rx="6" fill="#ffffff" stroke="#e6dfd4"/>
    <rect x="0" y="0" width="56" height="36" rx="6" fill="#ffffff" stroke="#c0521f"/>
    <rect x="8" y="9" width="28" height="4" rx="2" fill="#c0521f"/>
    <rect x="8" y="18" width="38" height="3" rx="1.5" fill="#e6dfd4"/>
    <rect x="8" y="25" width="22" height="3" rx="1.5" fill="#e6dfd4"/>
  </g>
  <g class="badge">
    <rect x="852" y="164" width="72" height="26" rx="13" fill="#c0521f"/>
    <text x="888" y="181" class="mono" font-size="12" fill="#fffdf9" text-anchor="middle">15 / day</text>
  </g>

  <g transform="translate(616,60)"><g class="k a"><use href="#job" xlink:href="#job"/></g></g>
  <g transform="translate(616,100)"><g class="k b"><use href="#job" xlink:href="#job"/></g></g>
  <g transform="translate(616,140)"><g class="k c"><use href="#job" xlink:href="#job"/></g></g>
  <g transform="translate(616,180)"><g class="k d"><use href="#job" xlink:href="#job"/></g></g>
  <g transform="translate(616,80)"><g class="k e"><use href="#job" xlink:href="#job"/></g></g>
  <g transform="translate(616,160)"><g class="k f"><use href="#job" xlink:href="#job"/></g></g>
</svg>
